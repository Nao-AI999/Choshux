<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome - Choshux New World</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      --card-bg: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 255, 255, 0.15);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --success: #22c55e;
      --success-light: #4ade80;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 48px 36px;
      max-width: 540px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      animation: fadeIn 0.8s ease-out forwards;
    }

    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 9999px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    .badge-success {
      background: rgba(34, 197, 94, 0.15);
      color: var(--success-light);
    }

    .success-icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(34, 197, 94, 0.15);
      border: 2px solid var(--success);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      color: var(--success);
      box-shadow: 0 0 24px rgba(34, 197, 94, 0.3);
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .success-icon svg {
      width: 38px;
      height: 38px;
    }

    h1 {
      font-size: 2.25rem;
      font-weight: 700;
      line-height: 1.25;
      margin-bottom: 16px;
      color: #ffffff;
    }

    p.lead {
      font-size: 1.1rem;
      color: var(--text-sub);
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .divider {
      width: 60px;
      height: 3px;
      background: var(--accent);
      border-radius: 2px;
      margin: 0 auto 28px;
    }

    .divider-success {
      background: var(--success);
    }

    .message-box {
      background: rgba(255, 255, 255, 0.04);
      border-radius: 12px;
      padding: 20px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      margin-bottom: 32px;
    }

    .message-box p {
      color: #e2e8f0;
      font-size: 0.95rem;
      line-height: 1.7;
    }

    .btn {
      display: inline-block;
      background: var(--accent);
      color: #0f172a;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
    }

    .btn:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.35);
    }

    .btn-secondary {
      background: transparent;
      color: var(--text-main);
      border: 1px solid var(--card-border);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.3);
      box-shadow: none;
      transform: translateY(-2px);
    }

    .screen-fade {
      animation: fadeIn 0.5s ease-out forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(16px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes popIn {
      0% {
        transform: scale(0.5);
        opacity: 0;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <!-- オープニング画面 -->
    <div id="screen-opening">
      <div class="badge">Opening</div>
      <h1>ようこそ、Choshux New World へ</h1>
      <div class="divider"></div>
      <p class="lead">新しいプロジェクトのスタートです！</p>

      <div class="message-box">
        <p>
          ここから新しい機能やコンテンツを展開していくことができます。<br>
          準備が整い次第、次のステップへ進みましょう。
        </p>
      </div>

      <button id="btn-start" class="btn" onclick="goToSuccess()">はじめる</button>
    </div>

    <!-- 成功画面 -->
    <div id="screen-success" style="display: none;">
      <div class="success-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
      <div class="badge badge-success">Success</div>
      <h1>成功です！</h1>
      <div class="divider divider-success"></div>
      <p class="lead">次の画面への遷移が完了しました！</p>

      <div class="message-box">
        <p>
          オープニングから正常に切り替わりました。<br>
          ここから各種機能やメインコンテンツの構築を進めていくことができます。
        </p>
      </div>

      <button class="btn btn-secondary" onclick="goToOpening()">戻る</button>
    </div>
  </main>

  <script>
    function goToSuccess() {
      const opening = document.getElementById('screen-opening');
      const success = document.getElementById('screen-success');

      opening.style.display = 'none';
      success.style.display = 'block';
      success.classList.add('screen-fade');
    }

    function goToOpening() {
      const opening = document.getElementById('screen-opening');
      const success = document.getElementById('screen-success');

      success.style.display = 'none';
      opening.style.display = 'block';
      opening.classList.add('screen-fade');
    }
  </script>
</body>

</html>
