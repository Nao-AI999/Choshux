<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome - Choshux</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      --card-bg: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 255, 255, 0.15);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 48px 36px;
      max-width: 540px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      animation: fadeIn 0.8s ease-out forwards;
    }

    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 9999px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    h1 {
      font-size: 2.25rem;
      font-weight: 700;
      line-height: 1.25;
      margin-bottom: 16px;
      color: #ffffff;
    }

    p.lead {
      font-size: 1.1rem;
      color: var(--text-sub);
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .divider {
      width: 60px;
      height: 3px;
      background: var(--accent);
      border-radius: 2px;
      margin: 0 auto 28px;
    }

    .message-box {
      background: rgba(255, 255, 255, 0.04);
      border-radius: 12px;
      padding: 20px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      margin-bottom: 32px;
    }

    .message-box p {
      color: #e2e8f0;
      font-size: 0.95rem;
      line-height: 1.7;
    }

    .btn {
      display: inline-block;
      background: var(--accent);
      color: #0f172a;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
    }

    .btn:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.35);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="badge">Opening</div>
    <h1>ようこそ、Choshux へ</h1>
    <div class="divider"></div>
    <p class="lead">新しいプロジェクトのスタートです！</p>
    
    <div class="message-box">
      <p>
        ここから新しい機能やコンテンツを展開していくことができます。<br>
        準備が整い次第、次のステップへ進みましょう。
      </p>
    </div>

    <button class="btn" onclick="showMessage()">はじめる</button>
  </main>

  <script>
    function showMessage() {
      alert('プロジェクトスタート！次の実装を始めましょう。');
    }
  </script>
</body>
</html>
